# Render blueprint: one free web service built from the Dockerfile. See docs/DEPLOY.md.
# Nothing is deployed until the project owner connects this repository to a Render account.
services:
  - type: web
    name: trend-detective
    runtime: docker
    plan: free
    healthCheckPath: /api/places
    envVars:
      - key: TD_ALLOWED_ORIGINS
        value: ""
